name: PawGuard

options:
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    CODE_SIGN_STYLE: Automatic
    # Building straight from Xcode with no team set falls back to "Sign to Run
    # Locally", which signs ad hoc. macOS binds an Accessibility grant to the
    # designated requirement, and an ad-hoc requirement is the exact hash of
    # that exact binary — so every rebuild silently voids the permission while
    # System Settings goes on showing an enabled PawGuard row for the previous
    # build. Signing with a development certificate makes the requirement name
    # the bundle identifier and the certificate instead, both of which survive
    # a rebuild.
    #
    # Set PAWGUARD_TEAM_ID to your team (see `make doctor`) before generating
    # the project. Left unset this expands to nothing, which is exactly the
    # previous behaviour, and `make run` still signs correctly either way.
    DEVELOPMENT_TEAM: ${PAWGUARD_TEAM_ID}

targets:
  PawGuard:
    type: application
    platform: macOS
    sources:
      - path: PawGuard
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pawguard.app
        PRODUCT_NAME: PawGuard
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: PawGuard
        INFOPLIST_KEY_LSUIElement: true
        INFOPLIST_KEY_NSHighResolutionCapable: true
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
        Release:
          SWIFT_OPTIMIZATION_LEVEL: "-O"
    info:
      path: PawGuard/Info.plist
      properties:
        CFBundleDisplayName: PawGuard
        LSUIElement: true
        NSHighResolutionCapable: true
        NSHumanReadableCopyright: "© 2026 PawGuard"

  PawGuardTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
    dependencies:
      - target: PawGuard
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pawguard.tests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/PawGuard.app/Contents/MacOS/PawGuard"
